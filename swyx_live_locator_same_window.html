<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swyx Live Customer Locator</title><style>body{font:16px system-ui;margin:0;background:#f4f6f8;color:#203040}header,section{padding:16px}header{background:#16344b;color:white}h1{font-size:22px;margin:0}input,button{font:inherit;padding:8px;margin:5px 0}button{cursor:pointer}iframe{width:100%;height:60vh;border:0}#result{font-weight:bold;color:#a32222}label{display:block}</style><header><h1>Swyx Live Customer Locator</h1>Manual caller test · Same-window map</header><section><label>1. Select your adjusted customer CSV <input id="file" type="file" accept=".csv"></label><p id="status" role="status">No database loaded.</p><form id="lookup"><label>2. Incoming mobile number <input id="number" type="tel" placeholder="+316…" required></label><button>Locate customer</button><button type="button" id="reset">Reset</button></form><p id="result" aria-live="polite"></p><p id="mapstatus" role="status"></p></section><iframe id="map" title="Existing uMap customer map" referrerpolicy="no-referrer" src="https://umap.openstreetmap.fr/en/map/swyx_map_1489115"></iframe><script>
const base='https://umap.openstreetmap.fr/en/map/swyx_map_1489115';let customers=[];const $=id=>document.getElementById(id);function normalize(s){return s.trim().replace(/[\s()-]/g,'').replace(/^0031/,'+31').replace(/^06/,'+316').replace(/^316/,'+316')}
$('file').onchange=async()=>{customers=[];$('result').textContent='';try{const f=$('file').files[0];if(!f)return;const lines=(await f.text()).replace(/^\uFEFF/,'').trim().split(/\r?\n/);const headers=lines.shift().split(',');const required=['name','mobile','address','city','country','latitude','longitude'];if(headers.join(',')!==required.join(','))throw Error('Unexpected CSV headers');customers=lines.filter(Boolean).map(line=>{const v=line.split(',');if(v.length!==7)throw Error('Expected original seven-column demo CSV format');const [name,mobile,address,city,country,latitude,longitude]=v;const lat=Number(latitude),lon=Number(longitude);if(!latitude||!longitude||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)throw Error('Invalid coordinates');return {name,mobile,address,city,lat,lon}});$('status').textContent=customers.length+' customers loaded locally.'}catch(e){customers=[];$('status').textContent=e.message}};
function showMap(url){const old=$('map');const next=old.cloneNode(false);next.src=url;old.replaceWith(next)}
function locate(number){const c=customers.find(c=>normalize(c.mobile)===normalize(number));if(!c){$('result').textContent=customers.length?'Unknown caller':'Load CSV first';showMap(base);$('mapstatus').textContent='';return} $('result').textContent=c.name+' — '+c.address+', '+c.city;const url=base+'#17/'+c.lat+'/'+c.lon;showMap(url);$('mapstatus').textContent='Map requested for '+c.city+' in this window.';}
$('lookup').onsubmit=e=>{e.preventDefault();locate($('number').value)};$('reset').onclick=()=>{$('number').value='';$('result').textContent='';showMap(base);$('mapstatus').textContent=''};
</script></html>
